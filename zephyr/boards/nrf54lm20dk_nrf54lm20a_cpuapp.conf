# Nordic nRF54LM20 DK — phase 1 bring-up (LEDs / button / serial / NVS).
#
# The console is the board's default &uart20 through the on-board debugger's
# VCOM (115200) — no overlay redirect needed, and no reset-on-DTR (J-Link VCOM),
# so the IDE's Web Serial can open it directly.
#
# Phase 2 adds PWM (buzzer/servo/motors), SAADC (AREAD), I2S mic (VOICE) in
# this board's overlay, then flips CONFIG_TEXTOCHIP_AI back on.
CONFIG_TEXTOCHIP_AI=y

# Interrupt-driven RX for the IDE serial link: the nRF UARTE in poll mode drops
# bytes in line bursts (no FIFO) — verified at bring-up during LOAD. The HAL
# switches to an ISR + ring buffer when this is set (see hal_zephyr.cpp).
CONFIG_UART_INTERRUPT_DRIVEN=y

# Phase 2 slice 1: the buzzer (TONE) on PWM20 ch0 -> P1.13 (see the overlay).
CONFIG_PWM=y

# Phase 2 slice 3 — VOICE: the INMP441 mic on the TDM peripheral (the nRF54L has
# no I2S block; TDM binds to the Zephyr I2S API). CONFIG_I2S pulls in the
# nrf-tdm driver for the &tdm node the overlay enables.
CONFIG_I2S=y

# No crypto in the image: the DK's psa_rng devicetree node is disabled in our
# overlay (it pulls in nrf_security/CRACEN, whose init hard-faults at boot when
# the KMU IKG seed is absent, e.g. after ERASEALL). NRF_SECURITY itself is
# `select`ed by NCS plumbing so it can't be =n here — dropping the DT node is
# what actually removes the crypto init from boot.
