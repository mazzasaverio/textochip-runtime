# Arduino UNO R4 WiFi (RA4M1: Cortex-M4F, 32 KB RAM, 256 KB code flash).
# Phase 1, see docs/DECISIONS.md 2026-10-07.

# No AI tier: TFLM and its tensor arena do not fit in 32 KB of RAM. AISTART and
# INFER still execute; VOICE() and SEE() read "none".
CONFIG_TEXTOCHIP_AI=n

# Sized for 32 KB of RAM. The 24 KB main stack in prj.conf exists for the MFCC
# path, which is off here.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=6144

# 128 instructions (~11 KB) instead of 256: the longest bundled non-AI example
# compiles to 60. The IDE warns at the same cap (lib/boards.ts).
CONFIG_TEXTOCHIP_MAX_PROGRAM=128
CONFIG_TEXTOCHIP_STORE_BYTES=2048

# Peripherals wired in this board's overlay.
CONFIG_PWM=y          # buzzer (GPT0) + servo (GPT3)
CONFIG_ADC=y          # AREAD on A0
