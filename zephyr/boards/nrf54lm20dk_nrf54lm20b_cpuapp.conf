# Nordic nRF54LM20 DK — the "B" chip build: voice on the AXON NPU via Nordic's
# nRF Edge AI Add-on (sdk-edge-ai), instead of our TFLite Micro path.
#
# Same board as the "A" build (LEDs/button/serial/NVS/PWM/TDM mic) — the only
# difference is the classifier behind VOICE(): CONFIG_TEXTOCHIP_NRF_EDGEAI swaps
# ai_service.cpp (MFCC + TFLM) for ai_nrf_edgeai.cpp (Nordic's end-to-end,
# streaming, NPU-accelerated KWS model). Build with the add-on as a module:
#   west build -b nrf54lm20dk/nrf54lm20b/cpuapp zephyr \
#       -- -DEXTRA_ZEPHYR_MODULES=$HOME/projects/sdk-edge-ai
#
# The edge-AI SERVICE framework (mic capture + VOICE opcodes + the poll loop)
# stays; only the model backend changes. See zephyr/CMakeLists.txt.
CONFIG_TEXTOCHIP_AI=y
CONFIG_TEXTOCHIP_NRF_EDGEAI=y

# Interrupt-driven RX for the IDE serial link (nRF UARTE drops line-burst bytes
# in poll mode — verified at bring-up).
CONFIG_UART_INTERRUPT_DRIVEN=y

# PWM (buzzer/servo/motors) + TDM mic (the INMP441 on the I2S API) — identical
# to the A build; the Nordic model eats the same 16 kHz int16 audio our TDM
# aiCapture already produces (feed_inputs is source-agnostic — no PDM required).
CONFIG_PWM=y
CONFIG_I2S=y

# Single-precision FPU (the mel DSP + the runtime use it; Zephyr leaves it OFF
# by default on the M33).
CONFIG_FPU=y

# ── Nordic nRF Edge AI Library + the Axon NPU (from the sdk-edge-ai module) ──
# The KWS model is compiled for Axon; the lib is the prebuilt Cortex-M33 static
# archive. INTERLAYER_BUFFER_SIZE mirrors the value Nordic's ww_kws app uses for
# this exact bundled model (its axon header static_asserts the minimum).
CONFIG_NRF_EDGEAI=y
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=6656
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# Bigger main stack: the inference path runs on the main thread (as in the TFLM
# build) and the Axon runtime + mel DSP want headroom.
CONFIG_MAIN_STACK_SIZE=24576

# C++ (our runtime core is C++17) + heap (the portable core uses std::string).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Camera (SEE()): the Arducam Mega talks SPI — see the overlay's spi22 block.
CONFIG_SPI=y
