# ESP32-S3 board extras (auto-merged with prj.conf by the build system).

# Peripherals wired in this board's overlay.
CONFIG_PWM=y          # buzzer + servo + motor EN (LEDC channels)
CONFIG_ADC=y          # analog input (AREAD)
CONFIG_I2S=y          # digital microphone (INMP441) for the edge-AI voice tier
CONFIG_DMA=y          # the ESP32-S3 I2S peripheral streams through GDMA

# USB CDC-ACM console (app-provided USB device on the USB-OTG controller),
# instead of the ESP32-S3 USB-Serial-JTAG console. The JTAG console resets the
# chip whenever the host toggles DTR/RTS (which Web Serial does on open) — an
# app CDC-ACM has no such behavior, so the IDE connects cleanly (this mirrors
# the Arduino "USB CDC On Boot"). See this board's overlay for the
# chosen-console redirect.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y

# The module's 8 MB octal PSRAM (the kit's Freenove ESP32-S3 WROOM N8R8; its
# pins, GPIO 33-37, are reserved in the IDE's descriptor). The voice window and
# the MFCC tables live there (src/ai/bigram.h): the internal RAM was full.
# A module without PSRAM still boots (Zephyr prints the failure) and the
# voice service stays silent.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=65536

# SENSE (a sensor read through Zephyr's sensor API): the BME280 on I2C.
CONFIG_I2C=y
CONFIG_SENSOR=y
