# Common configuration for every board. Board-specific extras live in
# boards/<board_target>.conf (auto-merged), board hardware in
# boards/<board_target>.overlay (auto-picked).

# C++17 + a libc with the heap, because the portable core uses std::string.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_GLIBCXX_LIBCPP=y     # full C++ stdlib (std::string/std::vector); not MINIMAL_LIBCPP
CONFIG_CPP_EXCEPTIONS=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# Core peripherals used by the HAL on every board.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Non-volatile storage for SAVE + boot autorun (the board's autonomy). NVS
# lives on the board's `storage` flash partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# 24 KB: the voice tier's on-device inference runs on the main thread
# (runtime tick -> ai_service::poll -> tcml_mfcc -> TFLM invoke) and the MFCC's
# frame/FFT locals alone blow an 8 KB stack — bench-proven on the nRF54LM20 DK
# (usage fault "Stack overflow" in tcml_mfcc on the FIRST real-audio inference;
# host builds never see it, their stacks are MBs). RAM headroom is ample.
CONFIG_MAIN_STACK_SIZE=24576
