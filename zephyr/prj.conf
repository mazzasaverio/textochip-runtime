# C++17 + a libc with the heap, because the portable core uses std::string.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_GLIBCXX_LIBCPP=y     # full C++ stdlib (std::string/std::vector); not MINIMAL_LIBCPP
CONFIG_CPP_EXCEPTIONS=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# Peripherals used by the HAL.
CONFIG_GPIO=y
CONFIG_PWM=y          # buzzer + servo (pwm node in app.overlay — see README)
CONFIG_ADC=y          # analog input (AREAD — adc channel in app.overlay)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# USB CDC-ACM console (app-provided USB device on the USB-OTG controller),
# instead of the ESP32-S3 USB-Serial-JTAG console. The JTAG console resets the
# chip whenever the host toggles DTR/RTS (which Web Serial does on open) — an
# app CDC-ACM has no such behavior, so the IDE connects cleanly (this mirrors the
# Arduino "USB CDC On Boot"). See app.overlay for the chosen-console redirect.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

CONFIG_MAIN_STACK_SIZE=8192
